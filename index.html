<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/assets/images/Awhad_logo.webp" />

    <!-- Basic SEO -->
    <title>Awhad Properties | Premium Homes & Commercial Spaces</title>
    <meta
      name="description"
      content="Discover premium apartments, commercial projects, and modern living with Awhad Properties in Mumbai. Explore our latest residential and commercial developments."
    />
    <meta
      name="keywords"
      content="Awhad Properties, premium homes, apartments in Mumbai, commercial projects, luxury flats, real estate"
    />
    <meta name="author" content="Awhad Properties" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.awhadproperties.com/" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Awhad Properties | Premium Homes & Commercial Spaces"
    />
    <meta
      property="og:description"
      content="Discover premium apartments, commercial projects, and modern living with Awhad Properties in India and UAE."
    />
    <meta property="og:url" content="https://www.awhadproperties.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://www.awhadproperties.com/assets/images/Awhad_logo.webp"
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0A3D62" />

    <!-- Structured Data: RealEstateBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Awhad Properties",
        "url": "https://www.awhadproperties.com",
        "logo": "https://www.awhadproperties.com/assets/images/Awhad_logo.webp",
        "image": "https://www.awhadproperties.com/assets/images/Awhad_logo.webp",
        "description": "Discover premium apartments, commercial projects, and modern living with Awhad Properties in India and UAE.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hyder garden main street, jamalia, Chennai 600003",
          "addressLocality": "Chennai",
          "addressRegion": "TN",
          "postalCode": "600012",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9384012300",
          "contactType": "customer service",
          "areaServed": "IN",
          "availableLanguage": ["en", "hi", "Tamil"]
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
